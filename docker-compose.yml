version: '3.8'

services:
  jupyter:
    build: .
    container_name: storytelling-matcom
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
      - ./src:/app/src
      - ./reports:/app/reports
    environment:
      - JUPYTER_ENABLE_LAB=yes
    restart: unless-stopped
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=''
      --NotebookApp.password=''
      --NotebookApp.allow_origin='*'